[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seconds-db-api"
version = "0.1.0"
description = "A simple data-summarization API + MCP server over ambulance-dispatch data."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "mcp[cli]>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Starlette 1.3+ TestClient prefers httpx2; installing it avoids the
    # StarletteDeprecationWarning emitted when only the old httpx is present.
    "httpx2>=2",
    "httpx>=0.27",
]
# Web dashboard (Reflex + buridan/ui). Optional so the API/MCP install stays lean.
ui = [
    "reflex>=0.9",
    "buridan-create>=0.1.21",
]

# Only the installable Python core. The Reflex web UI lives under web/ and is
# resolved by Reflex at runtime (it is not an installed package).
[tool.setuptools.packages.find]
include = ["seconds*", "seed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
